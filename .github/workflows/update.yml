name: Update data and site

on:
  schedule:
    # Tadawul closes at 15:00 Riyadh time (12:00 UTC), Sunday to Thursday.
    - cron: "37 12 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "data/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m pipeline.build
      - name: Save newly learned company names
        run: |
          if ! git diff --quiet data/symbols.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add company names" data/symbols.csv
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
